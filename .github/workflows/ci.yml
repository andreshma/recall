name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests (windows · py3.12 · locked)
    # requirements.lock is resolved for win/amd64 (onnxruntime-directml).
    runs-on: windows-latest
    steps:
      # Actions pinned by commit SHA; the comment records the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the locked environment (hashes required)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements.lock

      - name: Put src/ on the path (same .pth as the local setup, docs/USAGE.md)
        # Tests also spawn `python -I -m recall serve`, which ignores PYTHONPATH.
        run: python -c "import pathlib, sysconfig; pathlib.Path(sysconfig.get_paths()['purelib'], 'recall_src.pth').write_text(str(pathlib.Path('src').resolve()))"

      - name: Unit tests (no model, no real index)
        # The `model` marker (real model + real index) is excluded by default in
        # pyproject.toml; those suites run locally, see docs/TESTING.md.
        env:
          HF_HUB_OFFLINE: "1"
        run: python -I -m pytest -q

  security:
    name: supply-chain (SCA)
    runs-on: windows-latest
    # Advisory: surfaces known vulnerabilities without blocking unrelated changes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Audit the lockfile (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit==2.10.1
          pip-audit --require-hashes --disable-pip -r requirements.lock
