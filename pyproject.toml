[project]
name = "recall"
version = "0.2.0"
description = "Local, bilingual (ES/EN) semantic search over a technical book library for coding assistants: SQLite FTS5 + ONNX embeddings, a fail-open prompt hook and an MCP server."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "recall contributors" }]
keywords = ["rag", "retrieval", "embeddings", "sqlite", "fts5", "onnx", "mcp", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "onnxruntime-directml==1.24.4",
    "tokenizers==0.23.3",
]

[project.urls]
Homepage = "https://github.com/andreshma/recall"
Issues = "https://github.com/andreshma/recall/issues"

[project.scripts]
recall = "recall.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs the local model and the real index (slow)"]
addopts = "-m 'not model' -p no:cacheprovider"

