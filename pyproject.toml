[project]
name = "recall"
version = "0.1.0"
description = "Indice hibrido local (FTS5 + embeddinggemma) de los libros tecnicos del usuario, con servicio, MCP stdio y hook UserPromptSubmit."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.2",
    "onnxruntime-directml==1.24.4",
    "tokenizers==0.23.1",
]

[project.scripts]
recall = "recall.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: necesita el modelo local y el indice real (lento)"]
addopts = "-m 'not model' -p no:cacheprovider"

