[project]
name = "recall"
version = "0.3.1"
description = "Local, bilingual (ES/EN) semantic search over a technical book library for coding assistants: SQLite FTS5 + ONNX embeddings, a fail-open prompt hook and an MCP server."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "andreshma" }]
keywords = ["rag", "retrieval", "embeddings", "sqlite", "fts5", "onnx", "mcp", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: Spanish",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    # recall runs on Windows (DirectML; the lock is win/amd64). Other OSes get
    # the CPU runtime only so that the unit suite and static checks can run
    # there; they are not a supported runtime platform.
    "onnxruntime-directml==1.24.4; sys_platform == 'win32'",
    "onnxruntime==1.24.4; sys_platform != 'win32'",
    "tokenizers==0.23.3",
]

[project.urls]
Homepage = "https://github.com/andreshma/recall"
Repository = "https://github.com/andreshma/recall"
Documentation = "https://github.com/andreshma/recall/blob/main/docs/USAGE.md"
Changelog = "https://github.com/andreshma/recall/blob/main/CHANGELOG.md"
Issues = "https://github.com/andreshma/recall/issues"

[project.scripts]
recall = "recall.cli:main"

[dependency-groups]
# Same pins as requirements-dev.in (hash-locked in requirements-dev.lock, which
# is what CI installs); pytest itself is in requirements.lock.
dev = ["pytest==9.2.0", "ruff==0.17.4", "mypy==2.4.1", "coverage==7.17.2", "pip-audit==2.10.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

# The book metadata travels inside the package so that topic/year filters also
# work from a wheel (recall.metadata.PACKAGED_FILE). The labeled query sets in
# tests/data stay in the source checkout: `recall eval` needs --queries there.
[tool.hatch.build.targets.wheel.force-include]
"data/books_meta.json" = "recall/data/books_meta.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs the local model and the real index (slow)"]
addopts = "-m 'not model' -p no:cacheprovider"


[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["experiments"]

[tool.ruff.lint]
# Real errors and hygiene. No BLE (blind-except): the hook, the service and the MCP
# server catch Exception on purpose to fail open (ADR 0003).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PLE"]
ignore = [
  "E501",    # line length: decided by the existing code's formatting
  "SIM905",  # stopword lists in a .split() string: more readable that way
  "SIM105",  # contextlib.suppress adds no clarity to short try/except OSError blocks
  "RUF001", "RUF002", "RUF003",  # ambiguous characters: the text is accented Spanish and ‹›
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.12"
files = ["src/recall", "recall_hook.py"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.coverage.run]
source = ["recall", "recall_hook"]
omit = ["*/recall/__main__.py"]

[tool.coverage.report]
skip_empty = true
